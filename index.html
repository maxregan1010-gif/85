    filter:blur(100px);

    pointer-events:none;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    backdrop-filter:blur(28px);

        inset 0 1px rgba(255,255,255,.12);

/* =====================================
   عنوان RGB گیمینگ
===================================== */

.title{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    font-size:20px;

    font-weight:bold;

    letter-spacing:2px;

    /* رنگین‌کمان RGB */
    background:linear-gradient(
        90deg,
        #ff0000,
        #ff7a00,
        #ffff00,
        #00ff00,
        #00ffff,
        #008cff,
        #6a00ff,
        #ff00ff,
        #ff0000
    );

    background-size:400% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    /* انیمیشن حرکت رنگ‌ها */
    animation:
        rgbText 4s linear infinite,
        rgbGlow 1.5s ease-in-out infinite alternate;

}


/* حرکت رنگین‌کمان */

@keyframes rgbText{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* درخشش RGB گیمینگ */

@keyframes rgbGlow{

    0%{
        filter:
            drop-shadow(0 0 4px rgba(255,0,0,.8))
            drop-shadow(0 0 8px rgba(255,0,0,.35));
    }

    25%{

            drop-shadow(0 0 5px rgba(255,255,0,.8))

    50%{

    }

    75%{

    }

    100%{
